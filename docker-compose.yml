# Synthetic-only local integration environment. Do not expose development credentials.
services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","1G","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092","--advertise-kafka-addr","PLAINTEXT://kafka:9092"]
    healthcheck:
      test: ["CMD","rpk","cluster","health"]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh","-ec"]
    command: |
      rpk topic list --brokers kafka:9092 | grep -qw market-events ||
        rpk topic create market-events --partitions 3 --replicas 1 --brokers kafka:9092
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U event_user -d events"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      KAFKA_GROUP: event-workers
      WORKER_ID: worker-1
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    command: ["/app/event_worker"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      KAFKA_GROUP: event-workers
      WORKER_ID: worker-2
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    command: ["/app/event_worker"]
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      EVENT_COUNT: ${EVENT_COUNT:-100}
      START_ID: ${START_ID:-1}
    command: ["/app/event_producer"]
    profiles: ["manual"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    ports:
      - "127.0.0.1:8000:8000"
    profiles: ["api"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
