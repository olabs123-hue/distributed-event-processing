services:
  kafka:
    image: bitnami/kafka:3.9
    container_name: dep-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: bitnami/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      "kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic market-events --partitions 3 --replication-factor 1"
    restart: "no"

  postgres:
    image: postgres:16
    container_name: dep-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      KAFKA_GROUP: event-workers
      WORKER_ID: worker-1
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    command: ["/app/event_worker"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      KAFKA_GROUP: event-workers
      WORKER_ID: worker-2
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    command: ["/app/event_worker"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: market-events
      EVENT_COUNT: 100
    command: ["/app/event_producer"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://event_user:event_password@postgres:5432/events
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
